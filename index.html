html,body{margin:0;background:var(--bg);font-family:'GothamApp',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,header h1,.sheet .sh h1,.login h1,#pv h1,#pv h2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
h1 small,header small{font-family:'GothamApp',-apple-system,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(#41202a,var(--md));color:#fff;padding:calc(var(--top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-size:11px;color:var(--g);font-weight:500;letter-spacing:0}
.hb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px}
main{padding:calc(var(--top) + 66px) 12px calc(var(--bot) + 90px);max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(var(--bot) + 6px)}
nav.tabs button{flex:1;background:none;border:0;padding:4px 0;font-size:10.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--m)}
.fab{position:fixed;right:16px;bottom:calc(var(--bot) + 74px);z-index:21;width:54px;height:54px;border-radius:27px;border:0;background:var(--m);color:#fff;font-size:30px;line-height:54px;box-shadow:0 6px 18px rgba(55,27,35,.35)}
h2{font-size:17px;color:var(--m);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--mu);font-weight:500;font-size:12px}
h3{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;position:relative;cursor:pointer}
.pdfb{position:absolute;top:8px;right:8px;border:1px solid var(--ln);background:#faf8f6;color:#582a2a;border-radius:8px;font:500 11px 'GothamApp',-apple-system,sans-serif;padding:4px 8px}
#pv{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;-webkit-overflow-scrolling:touch}
#pv .pvbar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#582a2a;color:#fff}
#pv .pvbar button{background:#fff;color:#582a2a;border:0;border-radius:9px;padding:8px 12px;font-weight:700}
#pv .pvb{padding:14px 16px 40px;font-size:13px;color:#1f2328}
#pv h1{font-size:18px;color:#582a2a;margin:4px 0}#pv h2{font-size:14px;color:#582a2a;border-bottom:2px solid #582a2a;padding-bottom:4px;margin:18px 0 6px}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
let D = null, tab = (function(){ try { return localStorage.getItem('mk_tab') || 'home'; } catch(e){ return 'home'; } })(), st = {jobSeg:'all', icraSeg:'alarm', icraSite:'', icraStage:'', q:{}, month:null, calSeg:'up'};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up = s => String(s || '').toLocaleUpperCase('tr-TR');
const nf = new Intl.NumberFormat('tr-TR', {minimumFractionDigits:0, maximumFractionDigits:2});
const money = c => nf.format((c || 0) / 100) + ' TL';
const amt = c => c ? String((c / 100).toFixed(2)).replace('.', ',').replace(/,00$/, '') : '';
const WD = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MO = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const pd = s => { if (!s) return null; const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const fd = s => { const d = pd(s); return d ? String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear() : ''; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const days = s => { const d = pd(s); return d ? Math.round((d - today()) / 864e5) : null; };
const rel = s => { const n = days(s); return n == null ? '' : n === 0 ? 'bugün' : n === 1 ? 'yarın' : n === -1 ? 'dün' : n < 0 ? (-n) + ' gün geçti' : n + ' gün kaldı'; };
const dayLab = s => { const d = pd(s); return d ? fd(s) + ' ' + WD[d.getDay()] + ' · ' + rel(s) : ''; };
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
/* ================== OneDrive bağlantısı (Microsoft hesabı, PKCE) ================== */
const AUTH = 'https://login.microsoftonline.com/' + (window.MK_AUTHORITY || 'common') + '/oauth2/v2.0';
const SCOPES = 'offline_access Files.ReadWrite User.Read';
const REDIRECT = location.origin + location.pathname;
const LS = {get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} }, del: k => { try { localStorage.removeItem(k); } catch(e){} }};
let CID = LS.get('mk_cid') || (window.MK_CLIENT_ID || ''), PATH = LS.get('mk_path') || '';
let Q = JSON.parse(LS.get('mk_queue') || '[]'), R = {}, syncing = false;
const saveQ = () => LS.set('mk_queue', JSON.stringify(Q));
const b64url = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

async function login(){
  const v = rnd(64), st8 = rnd(16);
  LS.set('mk_pkce', v); LS.set('mk_state', st8);
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  location.href = AUTH + '/authorize?client_id=' + encodeURIComponent(CID) + '&response_type=code&response_mode=query&redirect_uri=' + encodeURIComponent(REDIRECT) +
    '&scope=' + encodeURIComponent(SCOPES) + '&code_challenge=' + ch + '&code_challenge_method=S256&state=' + st8 + '&prompt=select_account';
}
async function tokenReq(params){
  const r = await fetch(AUTH + '/token', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(Object.assign({client_id: CID, scope: SCOPES}, params))});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || 'Giriş hatası');
  LS.set('mk_at', j.access_token); LS.set('mk_exp', String(Date.now() + (j.expires_in - 120) * 1000));
  if (j.refresh_token) LS.set('mk_rt', j.refresh_token);
  return j.access_token;
}
async function handleRedirect(){
  const u = new URL(location.href), code = u.searchParams.get('code'), err = u.searchParams.get('error_description');
  if (!code && !err) return;
  history.replaceState(null, '', REDIRECT);
  if (err) { toast(err); return; }
  if (u.searchParams.get('state') !== LS.get('mk_state')) { toast('Giriş doğrulanamadı, tekrar deneyin'); return; }
  await tokenReq({grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT, code_verifier: LS.get('mk_pkce') || ''});
}
async function token(){
  const at = LS.get('mk_at'), exp = +(LS.get('mk_exp') || 0);
  if (at && Date.now() < exp) return at;
  const rt = LS.get('mk_rt');
  if (rt) { try { return await tokenReq({grant_type: 'refresh_token', refresh_token: rt, redirect_uri: REDIRECT}); } catch(e){ LS.del('mk_rt'); } }
  return null;
}
function logout(){ ['mk_at','mk_exp','mk_rt'].forEach(LS.del); D = null; loginView(); }
const encPath = p => p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
async function graph(path, opt){
  const t = await token();
  if (!t) { loginView(); throw new Error('Giriş gerekli'); }
  opt = opt || {};
  opt.headers = Object.assign({Authorization: 'Bearer ' + t}, opt.headers || {});
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, opt);
  if (r.status === 401) { LS.del('mk_at'); LS.del('mk_exp'); }
  return r;
}
async function readFile(rel){
  let r;
  try { r = await graph('/me/drive/root:/' + encPath(rel) + ':/content'); if (r.ok) return await r.text(); if (r.status === 404) return null; }
  catch(e){ if (e.message === 'Giriş gerekli') throw e; }
  const m = await graph('/me/drive/root:/' + encPath(rel) + '?$select=id,@microsoft.graph.downloadUrl');
  if (m.status === 404) return null;
  if (!m.ok) throw new Error('OneDrive okunamadı (' + m.status + ')');
  const j = await m.json(), url = j['@microsoft.graph.downloadUrl'];
  const r2 = await fetch(url);
  if (!r2.ok) throw new Error('OneDrive dosyası indirilemedi');
  return await r2.text();
}
async function findPath(){
  const cands = [PATH, 'Desktop/KASA/TELEFON', 'Masaüstü/KASA/TELEFON', 'Desktop/MÜREKKEP SERVER/TELEFON', 'Masaüstü/MÜREKKEP SERVER/TELEFON', 'KASA/TELEFON'].filter(Boolean);
  for (const c of cands) { const r = await graph('/me/drive/root:/' + encPath(c) + '/veri.json?$select=id'); if (r.ok) return c; }
  const s = await graph("/me/drive/root/search(q='murekkep_server_telefon')?$select=name,parentReference");
  if (s.ok) { const j = await s.json(); for (const it of j.value || []) { const p = (it.parentReference && it.parentReference.path || '').replace(/^\/drive\/root:\/?/, ''); if (p) return decodeURIComponent(p); } }
  return null;
}

/* ================== veri ve işlem kuyruğu ================== */
async function load(silent){
  if (syncing) return; syncing = true;
  try {
    if (!PATH || !D) { const p = await findPath(); if (!p) throw new Error('OneDrive\'da MÜREKKEP verisi bulunamadı. Bilgisayarda programı bir kez açın (TELEFON klasörü oluşur) ve OneDrive eşitlemesini bekleyin; ya da Ayarlar\'dan klasör yolunu girin.'); PATH = p; LS.set('mk_path', p); }
    let txt = await readFile(PATH + '/veri.json');
    if (!txt) { const old = PATH; PATH = ''; const p = await findPath(); if (p) { PATH = p; LS.set('mk_path', p); txt = await readFile(PATH + '/veri.json'); } else PATH = old; }
    if (!txt) throw new Error('veri.json bulunamadı: ' + PATH);
    const fresh = JSON.parse(txt);
    try { const rt = await readFile(PATH + '/sonuclar.json'); R = {}; if (rt) for (const x of (JSON.parse(rt).results || [])) R[x.opId] = x; } catch(e){}
    for (const q of Q) { const x = R[q.opId]; if (x) { q.done = true; q.ok = x.ok; q.msg = x.msg; } }
    Q = Q.filter(q => !(q.done && q.ok)); saveQ();
    D = fresh;
    for (const q of Q) if (!q.done) applyLocal(q.op, q.body);
    LS.set('mk_cache', txt);
    await flush();
    render();
    if (!silent) toast('Güncellendi · bilgisayar verisi ' + D.now);
  } catch(e) {
    if (e.message === 'Giriş gerekli') return;
    if (!D) { const c = LS.get('mk_cache'); if (c) { D = JSON.parse(c); for (const q of Q) if (!q.done) applyLocal(q.op, q.body); render(); toast('Çevrimdışı: son kayıtlı veri gösteriliyor'); } }
    if (!D) $('#app').innerHTML = '<div class="login"><h1>Bağlanılamadı</h1><p class="mu">' + esc(e.message) + '</p><button class="btn" onclick="load()">Tekrar Dene</button><button class="btn sec" onclick="setupView()">Ayarlar</button></div>';
    else toast(e.message);
  } finally { syncing = false; }
}
async function flush(){
  for (const q of Q) {
    if (q.sent || q.done) continue;
    try {
      const r = await graph('/me/drive/root:/' + encPath(PATH + '/gelen_kutusu/' + q.opId + '.json') + ':/content', {method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({opId: q.opId, op: q.op, body: q.body, label: q.label, at: q.at, device: 'iPhone'})});
      if (r.ok) q.sent = true;
    } catch(e){}
  }
  saveQ();
}
function opLabel(op, b){
  const t = {'job/save':'İş / duruşma: ' + (b.title || ''), 'job/done':'Yapıldı / sonuç', 'job/delete':'İş silme', 'icra/save':'İcra: ' + (b.office || '') + ' ' + (b.no || ''), 'icra/tahsilat':'Tahsilat ' + (b.amount || '') + ' TL', 'icra/tahsilat/delete':'Tahsilat silme',
    'icra/tahsilat/transfer':'Emanet aktarımı', 'icra/haciz':'Haciz: ' + (b.type || ''), 'icra/haciz/delete':'Haciz silme', 'icra/delete':'İcra dosyası silme', 'job/attach':'Dosya: ' + (b.name || ''), 'icra/close':'İcra dosyası kapatma', 'maas/save':'Maaş haczi: ' + (b.person || ''), 'client/save':'Müvekkil: ' + (b.name || ''),
    'case/save':'Dosya: ' + (b.court || '') + ' ' + (b.esas || ''), 'move/save':(b.type || 'Hareket') + ' ' + (b.amount || '') + ' TL', 'move/delete':'Hareket silme', 'entry/save':(b.type || '') + ': ' + (b.category || '') + ' ' + (b.amount || '') + ' TL', 'entry/delete':'Kasa kaydı silme'}[op];
  return t || op;
}
function validate(op, b){
  if (op === 'job/save') { const ev = b.kind === 'TAKVIM' || b.kind === 'ARABULUCULUK'; if (!b.title) return ev ? 'Mahkeme / yer bilgisini girin' : 'Dosya / müvekkil bilgisini girin'; if (!ev && !(b.tags || []).length) return 'En az bir bölüm seçin'; if ((ev || (b.tags || []).includes('SURELI')) && !b.date) return ev ? 'Tarih girin' : 'Süreli işte son gün zorunlu'; }
  if (op === 'job/done' && b.done) { const j = D.jobs.find(x => x.id === b.id); if (j && (j.kind === 'TAKVIM' || j.kind === 'ARABULUCULUK') && !b.note) return 'Not zorunlu'; }
  if (op === 'icra/save') { if (!b.office || !b.no) return 'İcra dairesi ve dosya no zorunlu'; if (!b.site && !b.client) return 'Müvekkil zorunlu'; if (b.stage === 'İtirazla durdu (dava açılacak)' && !b.objServed) return 'İtirazın tebliğ tarihi zorunlu'; if (b.stage === 'Haricen tahsil (kapatılacak)' && (!b.feeAsked || !b.feeGot)) return 'Haricen tahsil: ücret soruları zorunlu'; if (b.stage === 'Haricen tahsil (kapatılacak)' && b.feeGot === 'E' && !(parseTL(b.feeGotAmount) > 0)) return 'Alınan ücret tutarını girin'; }
  if ((op === 'icra/tahsilat' || op === 'move/save' || op === 'entry/save') && !(parseTL(b.amount) > 0)) return 'Tutar girin';
  if (op === 'entry/save' && !b.category) return 'Kategori girin';
  if (op === 'client/save' && !b.name) return 'Ad / ünvan zorunlu';
  if (op === 'maas/save' && !b.person) return 'Personel adı zorunlu';
  if (op === 'case/save' && !b.court && !b.esas && !b.invNo) return 'Mahkeme / esas no ya da soruşturma no girin';
  return null;
}
function parseTL(s){ s = String(s || '').replace(/[\s₺]/g, '').replace(/TL$/i, ''); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); const v = parseFloat(s); return isNaN(v) ? 0 : Math.round(v * 100); }
async function send(op, body){
  body = Object.assign({}, body);
  if (/\/save$/.test(op) && !body.id) body.id = uuid();
  if (op === 'icra/tahsilat' || op === 'icra/haciz') body.newId = uuid();
  const e = validate(op, body); if (e) throw new Error(e);
  const q = {opId: Date.now().toString(36) + '-' + rnd(6), op: op, body: body, label: opLabel(op, body), at: new Date().toISOString(), sent: false};
  Q.push(q); saveQ();
  applyLocal(op, body);
  flush().then(() => { if (tab === 'home') render(); });
  return {sonuc: body.id || 'ok'};
}
async function api(path, body){
  if (path === 'data') { await load(true); return D; }
  if (path === 'deadline') return deadlineCalc(body.start, +body.n, body.unit, !!body.jh);
  return send(path, body || {});
}
async function save(path, body, msg){
  try { const r = await send(path, body); toast(msg || 'Kaydedildi · bilgisayara iletiliyor'); closeSheet(); render(); return r; }
  catch(e){ const er = sheetStack.length ? sheetStack[sheetStack.length - 1].querySelector('.err') : null; if (er) er.textContent = e.message; toast(e.message); return null; }
}
async function refreshSheet(fn){ render(); if (sheetStack.length) { const s = sheetStack.pop(); s.remove(); } fn(); }

/* ---- telefonda anında görünmesi için yerel uygulama (bilgisayar işleyince kesinleşir) */
function siteNameOf(code){ const s = (D.sites || []).find(x => x.code === code); return s ? s.name : code; }
function upsert(arr, obj){ const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = Object.assign({}, arr[i], obj); else arr.push(obj); }
function applyLocal(op, b){
  if (!D) return;
  try {
    if (op === 'job/save') { const ev = b.kind === 'TAKVIM' || b.kind === 'ARABULUCULUK'; const tags = b.tags || []; const k = ev ? b.kind : tags[0];
      upsert(D.jobs, {id: b.id, kind: k, tags: ev ? [] : tags.filter(t => t !== k), date: b.date || '', time: b.time || '', title: b.title, file: b.file || '', detail: b.detail || '', assignee: b.assignee || 'Faruk', attend: ev ? (b.attend || '') : '', done: (D.jobs.find(x => x.id === b.id) || {}).done || false, att: (D.jobs.find(x => x.id === b.id) || {}).att || 0}); }
    else if (op === 'job/done') { const j = D.jobs.find(x => x.id === b.id); if (j) { if (b.attend) j.attend = b.attend; if (b.by) j.doneBy = b.by; j.done = !!b.done; j.doneNote = b.done ? b.note || '' : ''; j.doneReason = b.done ? (b.reason || (j.kind === 'TAKVIM' ? 'Duruşmaya girildi' : 'İşlem yapıldı')) : ''; j.doneAt = b.done ? new Date().toISOString().slice(0, 16) : ''; } }
    else if (op === 'job/delete') D.jobs = D.jobs.filter(x => x.id !== b.id);
    else if (op === 'job/attach') { const j = D.jobs.find(x => x.id === b.id); if (j) { if (b.role === 'minutes') j.minutesFile = b.name; else if (b.role === 'form') j.formFile = b.name; else j.att = (j.att || 0) + 1; } }
    else if (op === 'icra/save') { const old = D.icra.find(x => x.id === b.id) || {alarms: [], haciz: [], tah: [], level: 'g'};
      upsert(D.icra, Object.assign({}, old, b, {client: b.site ? siteNameOf(b.site) : b.client, clientRaw: b.site ? '' : b.client, amount: parseTL(b.amount), fee: parseTL(b.fee), feeGotAmount: parseTL(b.feeGotAmount), last: b.lastAction || old.last || '', alarms: old.alarms || [], haciz: old.haciz || [], tah: old.tah || [], level: old.level || 'g'})); }
    else if (op === 'icra/tahsilat') { const f = D.icra.find(x => x.id === b.fileId); if (f && !f.tah.some(t => t.id === b.newId)) { const c = parseTL(b.amount); f.tah.push({id: b.newId, date: b.date, kind: b.kind, cents: c, note: b.note || '', transferred: ''}); if (b.kind === 'Asıl alacak') D.emanet += c; } }
    else if (op === 'icra/tahsilat/delete') { for (const f of D.icra) { const t = f.tah.find(x => x.id === b.id); if (t) { if (t.kind === 'Asıl alacak' && !t.transferred) D.emanet -= t.cents; f.tah = f.tah.filter(x => x.id !== b.id); } } }
    else if (op === 'icra/tahsilat/transfer') { for (const f of D.icra) { const t = f.tah.find(x => x.id === b.id); if (t) { if (t.kind === 'Asıl alacak') { if (!t.transferred && b.date) D.emanet -= t.cents; else if (t.transferred && !b.date) D.emanet += t.cents; } t.transferred = b.date || ''; if (b.date) f.alarms = f.alarms.filter(a => a.kind !== 'emanet'); } } }
    else if (op === 'icra/haciz') { const f = D.icra.find(x => x.id === b.fileId); if (f && !f.haciz.some(h => h.id === b.newId)) f.haciz.push({id: b.newId, type: b.type, date: b.date || '', note: b.note || ''}); }
    else if (op === 'icra/haciz/delete') { for (const f of D.icra) f.haciz = f.haciz.filter(x => x.id !== b.id); }
    else if (op === 'icra/delete') D.icra = D.icra.filter(x => x.id !== b.id);
    else if (op === 'icra/close') { const f = D.icra.find(x => x.id === b.id); if (f) { f.stage = 'Kapandı'; f.closedDate = b.date || ''; f.closeNote = b.note || ''; f.nextStep = ''; f.nextDate = ''; f.alarms = []; f.level = 'g'; if (b.date) { f.lastAction = b.date; f.last = b.date; } } }
    else if (op === 'maas/save') { const old = D.maas.find(x => x.id === b.id) || {}; upsert(D.maas, Object.assign({}, old, b, {siteName: siteNameOf(b.site), monthly: parseTL(b.monthly), sent: parseTL(b.sent), debt: parseTL(b.debt), status: old.status || '', alarm: old.alarm || ''})); }
    else if (op === 'client/save') { const old = D.clients.find(x => x.id === b.id) || {balance: 0, feeGot: 0, agreed: 0, site: ''}; upsert(D.clients, Object.assign({}, old, b)); }
    else if (op === 'case/save') upsert(D.cases, {id: b.id, clientId: b.clientId, kind: b.kind, court: b.court, esas: b.esas, invUnit: b.invUnit, invNo: b.invNo, subject: b.subject, status: b.closed ? 'Kapandı' : 'Devam ediyor', note: b.note, fee: parseTL(b.fee),
      label: b.kind === 'Ceza' && !b.court ? (b.invUnit || 'Soruşturma') + ' ' + (b.invNo || '') + ' Soruşturma' : (b.court || '') + (b.esas ? '  ' + b.esas + ' E.' : '')});
    else if (op === 'move/save') { upsert(D.moves, {id: b.id, clientId: b.clientId, caseId: b.caseId || '', date: b.date, type: b.type, desc: b.desc || '', cents: parseTL(b.amount), toIncome: !!b.toIncome}); recalcClient(b.clientId); }
    else if (op === 'move/delete') { const m = D.moves.find(x => x.id === b.id); D.moves = D.moves.filter(x => x.id !== b.id); if (m) recalcClient(m.clientId); }
    else if (op === 'entry/save') upsert(D.entries, {id: b.id, date: b.date, type: b.type, category: b.category, description: b.description || '', cents: parseTL(b.amount)});
    else if (op === 'entry/delete') D.entries = D.entries.filter(x => x.id !== b.id);
  } catch(e) { console.log(e); }
}
function recalcClient(cid){ const c = D.clients.find(x => x.id === cid); if (!c) return; let bal = 0, fee = 0; for (const m of D.moves.filter(x => x.clientId === cid)) { if (m.type === 'Avans Alındı') bal += m.cents; else if (m.type === 'Ücret Alındı') fee += m.cents; else bal -= m.cents; } c.balance = bal; c.feeGot = fee; }

/* ---- süre hesabı (HMK 93 / 104) */
const FIXED_H = ['01-01','04-23','05-01','05-19','07-15','08-30','10-29'];
const REL_H = ['2026-03-20','2026-03-21','2026-03-22','2026-05-27','2026-05-28','2026-05-29','2026-05-30','2027-03-09','2027-03-10','2027-03-11','2027-05-16','2027-05-17','2027-05-18','2027-05-19'];
const isHol = d => { const s = iso(d); return FIXED_H.includes(s.slice(5)) || REL_H.includes(s); };
function deadlineCalc(start, n, unit, jh){
  const why = []; const s = pd(start); if (!s || !(n >= 0)) throw new Error('Tarih ve süre girin');
  const e = new Date(s);
  if (unit === 'gün') e.setDate(e.getDate() + n); else if (unit === 'hafta') e.setDate(e.getDate() + 7 * n); else if (unit === 'ay') { const d0 = e.getDate(); e.setDate(1); e.setMonth(e.getMonth() + n); const last = new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate(); e.setDate(Math.min(d0, last)); } else { const d0 = e.getDate(); e.setDate(1); e.setFullYear(e.getFullYear() + n); const last = new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate(); e.setDate(Math.min(d0, last)); }
  why.push(fd(start) + ' + ' + n + ' ' + unit + ' = ' + fd(iso(e)) + ' ' + WD[e.getDay()]);
  let end = e;
  if (jh) { const a = new Date(end.getFullYear(), 6, 20), b = new Date(end.getFullYear(), 7, 31); if (end >= a && end <= b) { end = new Date(end.getFullYear(), 8, 7); why.push('Adli tatile rastladı: tatilin bitiminden itibaren 1 hafta uzar (HMK 104) → ' + fd(iso(end))); } }
  let e2 = new Date(end); while (e2.getDay() === 0 || e2.getDay() === 6 || isHol(e2)) e2.setDate(e2.getDate() + 1);
  if (+e2 !== +end) why.push(fd(iso(end)) + ' hafta sonu / resmi tatil: ilk iş gününe uzar (HMK 93) → ' + fd(iso(e2)));
  return {date: iso(e2), why: why};
}

const F = {

}
async function uploadAttach(jobId, file, role){
  if (file.size > 4 * 1024 * 1024) throw new Error('Dosya 4 MB\'dan büyük – bilgisayardaki programdan ekleyin');
  const fid = Date.now().toString(36) + '-' + rnd(6) + '_' + file.name.replace(/[\\/:*?"<>|#%]/g, '-');
  const r = await graph('/me/drive/root:/' + encPath(PATH + '/gelen_kutusu/ekler/' + fid) + ':/content', {method: 'PUT', headers: {'Content-Type': 'application/octet-stream'}, body: file});
  if (!r.ok) throw new Error('Dosya yüklenemedi (' + r.status + ')');
  await send('job/attach', {id: jobId, role: role, file: fid, name: file.name});
}
const WDN = ['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'];
function noteJobs(j, txt){
  const out = []; if (!txt) return out;
  const ev = j.kind === 'TAKVIM' || j.kind === 'ARABULUCULUK', base = ev && j.kind === 'ARABULUCULUK' && j.file ? j.file + ' – arabuluculuk' : j.title + (j.file ? ' – ' + j.file : '');
  const NW = {bir:1,iki:2,'üç':3,'dört':4,'beş':5,'altı':6,yedi:7,sekiz:8,dokuz:9,on:10,'onbeş':15,'on beş':15,yirmi:20,otuz:30};
  txt.split(/\n+|;\s*/).forEach(line => {
    const t = line.trim().replace(/^[-–•*\d.)\s]+/, ''); if (t.length < 3) return;
    const low = t.toLocaleLowerCase('tr'); let due = null;
    let m = t.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/); if (m) due = new Date(+m[3], +m[2] - 1, +m[1]);
    if (!due) { m = low.match(/(?:^|[^\p{L}\d])(\d+|bir|iki|üç|dört|beş|altı|yedi|sekiz|dokuz|on beş|onbeş|on|yirmi|otuz)\s+(gün|hafta|ay)/u);
      if (m) { const n = /^\d+$/.test(m[1]) ? +m[1] : NW[m[1]]; if (n) { try { due = pd(deadlineCalc(iso(today()), n, m[2], false).date); } catch(e){} } } }
    if (!due && low.includes('yarın')) { due = new Date(today()); due.setDate(due.getDate() + 1); }
    if (!due) for (let i = 0; i < 7; i++) if (new RegExp('(^|\\s)' + WDN[i] + '(\\s|$|[,.:\'’])').test(low)) { due = new Date(today()); do { due.setDate(due.getDate() + 1); } while (due.getDay() !== i); break; }
    const acil = /acil|hemen|ivedi/.test(low);
    const who = /mücahi[dt]/.test(low) ? 'Mücahid' : /faruk/.test(low) ? 'Faruk' : (j.assignee || 'Faruk');
    let d = due ? iso(due) : ''; if (acil && !d) { const x = new Date(today()); x.setDate(x.getDate() + 1); d = iso(x); }
    out.push({kind: acil ? 'ONCELIKLI' : due ? 'SURELI' : 'NORMAL', date: d, title: base, who: who, detail: t + '  (← ' + j.title + (ev ? ' ' + fd(j.date) : '') + ')'});
  });
  return out;
}
function followForm(j, outcome, attend, extra){
  const plus = n => { const d = new Date(today()); d.setDate(d.getDate() + n); return iso(d); };
  const t = j.file ? j.file + ' – arabuluculuk' : j.title, dt = fd(j.date);
  const L = noteJobs(j, extra || '');
  if (outcome === 'Anlaşma' || outcome === 'Kısmen anlaşma') L.push({kind:'NORMAL', date: plus(7), title: t, detail: 'Arabuluculuk anlaşma belgesi (' + dt + ') – ödeme / edim takvimi takip edilecek; müvekkile bilgi verilecek; gerekirse icra edilebilirlik şerhi alınacak.'});
  const med = j.kind === 'ARABULUCULUK', tt = med ? t : j.title + (j.file ? ' – ' + j.file : '');
  if (!med && attend === 'Takipsiz bırak') { const d = pd(j.date) || new Date(today()); d.setMonth(d.getMonth() + 3); L.push({kind:'SURELI', date: iso(d), title: tt, detail: 'Duruşma (' + dt + ') takipsiz bırakıldı – dosya işlemden kaldırıldıysa 3 ay içinde yenilenmezse dava açılmamış sayılır (HMK 150). Talimat: yenilensin mi?'}); }
  if (!med && attend === 'Mazeret') L.push({kind:'ONCELIKLI', date: plus(2), title: tt, detail: 'Duruşma (' + dt + ') için mazeret bildirildi – mazeretin kabulü ve yeni duruşma tarihi UYAP\'tan kontrol edilecek.'});
  if (!med && attend === 'Tevkil') L.push({kind:'NORMAL', date: plus(3), title: tt, detail: 'Tevkil edilen avukattan (' + dt + ') duruşma notu ve zabıt alınacak.'});
  if (med && outcome && outcome !== 'Anlaşma' && outcome !== 'Ertelendi') L.push({kind:'ONCELIKLI', date: plus(7), title: t, who:'Faruk', detail: 'TALİMAT: Arabuluculuk sonucu (' + outcome + ', ' + dt + ') – dava açılsın mı, takipsiz bırakılsın mı, bekletilsin mi? Karar bu işe not olarak yazılacak.'});
  if (outcome === 'Anlaşmama' || outcome === 'Kısmen anlaşma') L.push({off:true, kind:'SURELI', date: plus(14), title: t, detail: 'Arabuluculuk son tutanağı (' + outcome.toLocaleLowerCase('tr') + ', ' + dt + ') – ' + (outcome === 'Kısmen anlaşma' ? 'anlaşılamayan kısım için ' : '') + 'dava açılacak (talimat "dava" ise). Dava açma süresini dosyaya göre kontrol edin.'});
  if (outcome === 'Vazgeçme') L.push({kind:'NORMAL', date: plus(7), title: t, detail: 'Arabuluculuktan vazgeçildi (' + dt + ') – müvekkile bilgi verilecek, dosya kapatılacak / sonraki adım belirlenecek.'});
  if (outcome === 'Ertelendi') L.push({kind:'ARABULUCULUK', date: '', title: j.title, file: j.file, detail: 'Ertelenen toplantı – önceki: ' + dt});
  if (!L.length) return;
  const nx = noteJobs(j, extra || '').length;
  let h = (nx ? '<div class="mu" style="margin:0 4px 6px">Notunuzdan <b>' + nx + '</b> iş çıkarıldı – tarih, bölüm ve sorumluyu kontrol edin.</div>' : '') + '<div class="mu" style="margin:0 4px 6px">' + (outcome ? 'Netice: <b>' + esc(outcome) + '</b> – ' : (attend ? 'Katılım: <b>' + esc(attend) + '</b> – ' : '')) + 'önerilen takip işleri. İstemediğinizi işaretten çıkarın.</div>';
  L.forEach((x, i) => h += '<div class="card"><label class="f"><input type="checkbox" id="fon' + i + '"' + (x.off ? '' : ' checked') + '> ' + ({SURELI:'Süreli iş',NORMAL:'Normal iş',ONCELIKLI:'Acil iş',ARABULUCULUK:'Yeni toplantı'})[x.kind] + '</label>' + F.text('ft' + i, 'Başlık', x.title) + F.date('fd' + i, x.kind === 'ARABULUCULUK' ? 'Toplantı tarihi' : 'Son gün / tarih', x.date) +
    (x.kind === 'ARABULUCULUK' ? F.time('fh' + i, 'Saat', '') : '') + F.sel('fw' + i, 'Sorumlu', D.owners, x.who || j.assignee || 'Faruk') + F.area('fx' + i, 'Açıklama', x.detail) + '</div>');
  h += '<button class="btn" id="fok">Seçilenleri ekle</button>';
  const s = openSheet('Takip İşleri', h);
  s.querySelector('#fok').onclick = async () => {
    try {
      for (let i = 0; i < L.length; i++) { if (!s.querySelector('#fon' + i).checked) continue; const x = L[i];
        if ((x.kind === 'SURELI' || x.kind === 'ARABULUCULUK') && !V('fd' + i)) throw new Error('Tarih girin: ' + V('ft' + i));
        await send('job/save', {kind: x.kind, tags: x.kind === 'ARABULUCULUK' ? [] : [x.kind], date: V('fd' + i), time: x.kind === 'ARABULUCULUK' ? V('fh' + i) : '', title: V('ft' + i), file: x.file || '', detail: V('fx' + i), assignee: V('fw' + i), attend: x.kind === 'ARABULUCULUK' ? (j.attend || '') : ''}); }
      toast('Takip işleri eklendi'); closeAll(); render();
    } catch(e){ s.querySelector('.err').textContent = e.message; }
  };
}

  const fill = () => { const t = CH('et')[0] || 'Gider'; s.querySelector('#ecl').innerHTML = (t === 'Gelir' ? D.catsIn : D.catsOut).map(c => '<option value="' + esc(c) + '">').join(''); };
  s.querySelector('#et').onchipchange = fill; fill();
  s.querySelector('#eok').onclick = () => save('entry/save', {id: id || '', type: CH('et')[0] || 'Gider', date: V('ed'), category: V('ec'), amount: V('ea'), description: V('eds')});
  if (id) s.querySelector('#edel').onclick = () => { if (confirm('Kayıt silinsin mi?')) save('entry/delete', {id}, 'Silindi'); };
}


document.addEventListener('visibilitychange', () => { if (!document.hidden && D) load(true); });
setInterval(() => { if (!document.hidden && D) load(true); }, 60000);
start();
</script>
</body>
</html>
